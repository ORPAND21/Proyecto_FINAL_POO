<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de Profesores</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <main>
        <nav>
            <a href="index.html">← Menú principal</a>
        </nav>

        <h1>Gestión de Profesores</h1>

        <section>
            <h2>Registrar profesor</h2>
            <form id="formProfesor">
                <label>Nombre
                    <input id="nombre" type="text" required>
                </label>
                <label>Celular
                    <input id="celular" type="tel" required>
                </label>
                <button type="submit">Guardar</button>
            </form>
            <p id="mensaje" role="status"></p>
        </section>

        <section>
            <h2>Profesores registrados</h2>
            <table>
                <thead>
                    <tr><th>ID</th><th>Nombre</th><th>Celular</th><th>Estado</th></tr>
                </thead>
                <tbody id="tabla"></tbody>
            </table>
            <p id="vacio" hidden>No hay profesores registrados.</p>
        </section>
    </main>

    <script src="api.js"></script>
    <script src="profesores.js"></script>
</body>
</html>
