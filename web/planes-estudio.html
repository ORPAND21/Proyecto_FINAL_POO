<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planes de estudio</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <main class="ancho">
        <nav>
            <a href="index.html">← Menú principal</a>
        </nav>

        <h1>Planes de estudio</h1>

        <section>
            <h2 id="tituloForm">Registrar plan de estudio</h2>
            <form id="formulario">
                <label>Versión
                    <input id="version" type="text" required>
                </label>
                <label>Programa
                    <select id="programa" required></select>
                </label>
                <button id="btnGuardar" type="submit">Guardar</button>
                <button id="btnCancelar" type="button" class="secundario" hidden>Cancelar</button>
            </form>
            <p id="mensaje" role="status"></p>
        </section>

        <section>
            <h2>Planes registrados</h2>
            <form class="filtro" onsubmit="return false">
                <label>Filtrar por programa
                    <select id="filtro"></select>
                </label>
            </form>
            <div class="tabla-scroll">
                <table>
                    <thead>
                        <tr><th>ID</th><th>Versión</th><th>Programa</th><th>Estado</th><th>Creación</th><th>Acciones</th></tr>
                    </thead>
                    <tbody id="tabla"></tbody>
                </table>
            </div>
            <p id="vacio" hidden>No hay planes para mostrar.</p>
        </section>
    </main>

    <script src="api.js"></script>
    <script src="planes-estudio.js"></script>
</body>
</html>
