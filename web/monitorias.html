<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monitorías</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <main class="ancho">
        <nav>
            <a href="index.html">← Menú principal</a>
        </nav>

        <h1>Monitorías</h1>

        <section>
            <h2>Crear monitoría</h2>
            <p>El estudiante debe estar admitido en el curso y el profesor asignado y activo en ese curso.</p>
            <form id="formAsignar">
                <label>Curso del periodo
                    <select id="selCurso" required></select>
                </label>
                <label>Estudiante (monitor)
                    <select id="selEstudiante" required></select>
                </label>
                <label>Profesor
                    <select id="selProfesor" required></select>
                </label>
                <button type="submit">Crear</button>
            </form>
            <p id="msgAsignar" role="status"></p>
        </section>

        <section>
            <h2>Consultar monitorías</h2>
            <form id="formFiltro">
                <label>Consultar por
                    <select id="filtroTipo">
                        <option value="todas">Todas</option>
                        <option value="estudiante">Estudiante</option>
                        <option value="profesor">Profesor</option>
                        <option value="curso">Curso del periodo</option>
                    </select>
                </label>
                <label id="grupoEstudiante" hidden>Estudiante
                    <select id="filtroEstudiante"></select>
                </label>
                <label id="grupoProfesor" hidden>Profesor
                    <select id="filtroProfesor"></select>
                </label>
                <label id="grupoCurso" hidden>Curso del periodo
                    <select id="filtroCurso"></select>
                </label>
                <button type="submit">Consultar</button>
            </form>
            <p id="msgLista" role="status"></p>

            <div class="tabla-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Estudiante</th>
                            <th>Profesor</th>
                            <th>Curso</th>
                            <th>Estado</th>
                            <th>Calificación</th>
                            <th>Comentario</th>
                            <th>Creación</th>
                            <th>Evaluación</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla"></tbody>
                </table>
            </div>
            <p id="vacio" hidden>No hay monitorías para esa consulta.</p>
        </section>
    </main>

    <script src="api.js"></script>
    <script src="monitorias.js"></script>
</body>
</html>
