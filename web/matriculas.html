<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Matrículas</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="matriculas.css">
</head>
<body>
    <main class="ancho">
        <nav>
            <a href="index.html">← Menú principal</a>
        </nav>

        <h1>Matrículas</h1>

        <section>
            <h2>Matricular estudiante en un curso</h2>
            <form id="formMatricular">
                <label>Estudiante
                    <select id="selEstudiante" required></select>
                </label>
                <label>Curso del periodo
                    <select id="selCurso" required></select>
                </label>
                <label>Profesor
                    <select id="selProfesor" required></select>
                </label>
                <button type="submit">Matricular</button>
            </form>
            <p id="resumenCurso" class="resumen"></p>
            <p id="msgMatricular" role="status"></p>
        </section>

        <section>
            <h2>Consultar matrículas</h2>
            <form id="formFiltro">
                <label>Consultar por
                    <select id="filtroTipo">
                        <option value="estudiante">Estudiante</option>
                        <option value="cursoPeriodo">Curso del periodo</option>
                    </select>
                </label>
                <label id="grupoEstudiante">Estudiante
                    <select id="filtroEstudiante"></select>
                </label>
                <label id="grupoCursoPeriodo" hidden>Curso del periodo
                    <select id="filtroCursoPeriodo"></select>
                </label>
                <button type="submit">Consultar</button>
            </form>
            <p id="msgLista" role="status"></p>

            <div class="tabla-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Estudiante</th>
                            <th>Curso</th>
                            <th>Materia</th>
                            <th>Periodo</th>
                            <th>Profesor</th>
                            <th>Estado</th>
                            <th>Fecha</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla"></tbody>
                </table>
            </div>
            <p id="vacio" hidden>No hay matrículas para esa consulta.</p>
        </section>
    </main>

    <script src="api.js"></script>
    <script src="matriculas.js"></script>
</body>
</html>
